
trigger:
  - main
  - feature/*

pool:
  name: russian_6000

stages:
  - stage: tfsec
    displayName: tfsec scan
    jobs:
      - job: tfsec
        displayName: tfsec scan
        steps:
          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: 'tfsec'

  - stage: tflint
    displayName: tflint scan
    jobs:
      - job: tflint
        displayName: tflint scan
        steps:
          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: 'tflint --recursive --force'

  - stage: plan
    displayName: plan
    jobs:
      - job: plan
        displayName: init
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'russian_SC'
              backendAzureRmStorageAccountName: 'storagepipeline11'
              backendAzureRmContainerName: 'mycontainer'
              backendAzureRmKey: 'terraform.tfstate'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: 'russian_SC'

  - stage: approval
    displayName: manual approval
    jobs:
      - job: approval
        displayName: manual approval
        pool: server
        steps:
          - task: ManualValidation@1
            inputs:
              notifyUsers: 'abc@gmail.com'
              approvers: 'rishi'

  - stage: apply
    displayName: apply
    jobs:
      - job: apply
        displayName: apply
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'russian_SC'
              backendAzureRmStorageAccountName: 'storagepipeline11'
              backendAzureRmContainerName: 'mycontainer'
              backendAzureRmKey: 'terraform.tfstate'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'apply'
              environmentServiceNameAzureRM: 'russian_SC'
